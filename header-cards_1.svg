<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="Jonathan Gilli, frontend developer e UI/UX">
<title>Jonathan Gilli — frontend developer / UI-UX</title>
<defs>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="ledmask" maskUnits="userSpaceOnUse" x="180" y="194" width="340" height="24"><rect x="180" y="194" width="340" height="24" fill="#000"/><rect class="led" x="214" y="194" width="110" height="24" fill="url(#lg)"/></mask>
</defs>
<style>
.name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:30px;font-weight:600;fill:#6E7781}
.role{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:400;fill:#6E7781}
.card,.back,.front,.spark{transform-box:fill-box;transform-origin:center;animation-delay:var(--d,0s)}
.back{transform:scaleX(0)}
.led{opacity:0}
@keyframes fade{0%{opacity:0}6%,92%{opacity:1}100%{opacity:0}}
@keyframes flipOut{0%,14%{transform:scaleX(1)}22%,100%{transform:scaleX(0)}}
@keyframes flipIn{0%,22%{transform:scaleX(0)}30%,100%{transform:scaleX(1)}}
@keyframes tw{0%,40%{opacity:0;transform:scale(.4)}48%{opacity:1;transform:scale(1)}58%{opacity:.3;transform:scale(.7)}68%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes scan{0%{transform:translateX(-130px)}100%{transform:translateX(270px)}}
@media (prefers-reduced-motion:no-preference){
.card{animation:fade 7s ease infinite}
.back{animation:flipOut 7s ease-in infinite}
.front{animation:flipIn 7s ease-out infinite}
.spark{animation:tw 7s ease-in-out infinite}
.led{opacity:1;animation:scan 3.5s linear infinite}}
</style>
