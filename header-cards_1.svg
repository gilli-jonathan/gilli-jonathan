<g class="back"><rect x="346" y="24" width="54" height="78" rx="7" fill="#3C3489"/><rect x="351" y="29" width="44" height="68" rx="4" fill="none" stroke="#FAF7F0" stroke-width="1" opacity=".7"/><path transform="translate(373,63) scale(.5)" d="M0 -11 L8 0 L0 11 L-8 0 Z" fill="#EF9F27"/></g>
</g>
